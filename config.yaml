  unknown: "Не понимаю. Воспользуйся кнопками меню."
  error: "Что-то пошло не так: {error}"

  cancel: "↩️ Меню"
  cancelled: "Возврат в меню."
  reload_ok: "✅ Конфиг перечитан."
  reload_denied: "⛔ Недоступно."
