# Вся кастомизация бота — здесь. Секреты (токены) живут в .env и сюда не кладутся.

bot:
  name: "Настроение в каналах"
  admin_ids: [123456789]          # кому доступен /reload

moods:                            # кнопки-эмодзи и их смысл; набор меняется правкой файла
  - emoji: "😂"
    label: "Смешное"
    prompt: "юмор, мемы, забавные ситуации"
    score_threshold: 6
  - emoji: "✅"
    label: "Хорошее"
    prompt: "хорошие новости"
    score_threshold: 6
  - emoji: "❌"
    label: "Плохие"
    prompt: "плохие новости"
    score_threshold: 6
  - emoji: "➖"
    label: "Нейтральное"
    prompt: "нейтральные новости"
    score_threshold: 6

llm:
  # Провайдер — прямой DeepSeek (ключ DEEPSEEK_API_KEY в .env):
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/chat/completions"
  api_key_env: "DEEPSEEK_API_KEY"
  # Альтернатива — OpenRouter (ключ OPENROUTER_API_KEY в .env, модели вида deepseek/deepseek-chat):
  # base_url: "https://openrouter.ai/api/v1/chat/completions"
  # api_key_env: "OPENROUTER_API_KEY"
  # model: "deepseek/deepseek-chat"
  max_tokens: 4000
  temperature: 0.2
  batch_size: 30                  # постов на один вызов LLM
  timeout_sec: 90

period:
  default_hours: 24
  presets: [3, 6, 12, 24]         # кнопки выбора периода
  min_hours: 1
  max_hours: 72

digest:
  top_n: 10                       # сколько постов в сводке
  text_limit: 200                 # обрезка текста поста, символов
  min_score_default: 7            # порог, если не задан у настроения
  show_views: true
  show_reasons: true              # показывать объяснение LLM «почему подходит»

fetch:
  max_pages_per_channel: 3        # глубина парсинга t.me/s
  request_delay_sec: 1.0          # пауза между запросами (анти-429)
  cache_minutes: 30               # свежесть кеша постов

fallback:
  keywords_enabled: true          # эвристика по ключевым словам, если LLM упал

voice:                            # озвучка сводки, edge-tts — бесплатно и без ключа
  enabled: true
  voice: "ru-RU-SvetlanaNeural"   # или ru-RU-DmitryNeural — мужской
  rate: "+8%"                     # скорость речи, формат '+8%' / '-10%'
  pitch: "+0Hz"                   # высота голоса, формат '+0Hz'
  max_chars: 2500                 # потолок на озвучку, ~2.5 минуты звука
  target_seconds: 45              # на сколько секунд просим LLM написать выпуск
  script_enabled: true            # false — читать сводку без LLM-пересказа
  script_prompt: |
    Ты — ведущий короткого новостного радиовыпуска.
    Тема выпуска: «{label}» — {prompt}.
    Ниже список постов из телеграм-каналов. Перескажи их живой устной речью
    как единый связный текст примерно на {seconds} секунд звучания.

    Правила:
    - начни одной вводной фразой, потом по одному-два предложения на новость
    - никаких ссылок, эмодзи, markdown, нумерации цифрами и слова «пост»
    - числа и проценты пиши словами
    - в ответе только тот текст, который надо произнести вслух

    {digest_block}

texts:
  start: |
    Привет! Я бот «Настроение в каналах» 🎭
    Добавь интересные каналы, выбери период и нажми эмодзи-настроение —
    я соберу только подходящие посты.

  menu: "Главное меню"
  menu_channels: "➕ Каналы"
  menu_period: "⏱ Период"
  menu_mood: "🎭 Настроение"
  menu_my_channels: "📋 Мои каналы"

  channels_prompt: |
    Пришли один или несколько каналов — @username или ссылки t.me/name.
    Можно списком в одном сообщении: через пробел, запятую или каждый с новой строки.
  channels_added_header: "Итог:"
  channel_added: "✅ @{username} — добавлен"
  channel_exists: "ℹ️ @{username} — уже в списке"
  channel_invalid: "❌ «{raw}» — не похоже на юзернейм канала"
  channel_private: "🔕 @{username} — приватный; добавлен в режиме поллинга: добавь бота админом"
  channel_error: "❌ @{username} — не удалось проверить: {error}"
  channel_list: "Мои каналы:"
  channels_empty: "Каналов пока нет — добавь через «➕ Каналы»."
  channel_deleted: "Канал @{username} удалён."
  channel_delete: "🗑 Удалить"
  channel_mode_public: "публичный"
  channel_mode_poll: "поллинг"

  choose_period: "Выбери период: {hours} ч (по умолчанию) — или пришли число часов."
  period_set: "Период сохранён: {hours} ч ⏱"
  invalid_period: "Нужно целое число от {min} до {max} часов."
  meaning_of_life: "Смысл жизни найден. Можно расходиться"

  choose_mood: "Какое настроение ищем?"
  analyzing: "🔍 Анализирую {count} постов за {hours} ч..."
  analyzing_batch: "🔍 Обработано {done}/{total} постов..."

  digest_header: "🎭 Настроение: {emoji} {label}"
  digest_meta: "📡 Каналы: {channels} | Период: {hours} ч"
  digest_found: "Найдено: {total} → топ-{top}"
  digest_item: |
    {num}. [{score}/10] {text}
    {meta}
    {url}
  digest_views_line: "{views} просмотров"
  digest_views_k: "{value}K"
  refresh: "🔄 Обновить"
  other_mood: "🎭 Другое настроение"
  voice_button: "🔊 Озвучить"
  voice_recording: "🎙 Записываю выпуск..."
  voice_rebuilding: "🔄 Собираю сводку заново..."
  voice_caption: "🎙 {emoji} {label} · {hours} ч"
  voice_intro: "Сводка: {label}. За последние {hours} часов отобрано новостей: {count}."
  voice_outro: "Это всё. Хорошего дня."
  voice_script_failed: "⚠️ LLM недоступен, озвучиваю сводку как есть."
  voice_disabled: "Озвучка выключена в конфиге."
  voice_error: "Не получилось озвучить: {error}"

  no_channels: "Сначала добавь каналы — кнопка «➕ Каналы»."
  no_posts: "За {hours} ч в твоих каналах не нашлось ни одного поста. Попробуй больший период."
  no_results: "За этот период ничего подходящего не нашлось. Попробуй другой период или настроение."
  llm_failed: "⚠️ LLM недоступен, показываю упрощённый фильтр."
